# macOS 러너에서 XcodeGen 으로 프로젝트를 만들고, 시뮬레이터 빌드 후 룩 미리보기 테스트를 돌려 결과 이미지를 아티팩트로 올립니다.
name: Build

on:
  push:
    branches-ignore:
      - look-preview
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch sample photos (if none committed)
        run: |
          mkdir -p DicaTests/Fixtures
          if ! ls DicaTests/Fixtures/*.jpg >/dev/null 2>&1; then
            for id in 1005 1011 1025 1027; do
              curl -fsSL --retry 3 -o "DicaTests/Fixtures/sample_$id.jpg" "https://picsum.photos/id/$id/1600/1200.jpg" || true
            done
          fi
          ls -la DicaTests/Fixtures

      - name: Generate project
        run: xcodegen generate

      - name: Build (iOS Simulator)
        run: |
          xcodebuild \
            -project Dica.xcodeproj \
            -scheme Dica \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Look preview (iOS Simulator tests)
        env:
          TEST_RUNNER_DICA_OUTPUT_DIR: ${{ github.workspace }}/look-output
        run: |
          xcodebuild \
            -project Dica.xcodeproj \
            -scheme Dica \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:DicaTests \
            CODE_SIGNING_ALLOWED=NO \
            test
          ls -la look-output

      - name: Upload look preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: look-preview
          path: look-output
          if-no-files-found: warn

      # 결과 이미지를 look-preview 브랜치에 덮어써서 GitHub 에서 바로 볼 수 있게 한다.
      # https://github.com/kimtl/appstore-pilot/tree/look-preview
      - name: Publish look preview branch
        if: success()
        run: |
          set -e
          cd look-output
          git init -q
          git checkout -q -b look-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "# 디카 룩 미리보기"
            echo
            echo "소스 커밋 \`${GITHUB_SHA::7}\` · $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            for f in *.jpg; do
              echo "## $f"
              echo
              echo "![$f]($f)"
              echo
            done
          } > README.md
          git add .
          git commit -q -m "Look preview for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" look-preview
